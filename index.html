
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Basic Configuration -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="author" content="Divyanshu Singh" />

    <!-- Primary SEO -->
    <title>
      Divyanshu Singh | Frontend Developer & BCA Student
    </title>

    <meta
      name="description"
      content="Explore the portfolio of Divyanshu Singh, a BCA student and frontend developer. Discover his web development projects, technical skills, experience, and professional journey."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link
      rel="canonical"
      href="https://developer-portfolio-six-rouge.vercel.app/"
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png?v=2" type="image/png" />

    <!-- Open Graph SEO -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Divyanshu Singh | Frontend Developer & BCA Student"
    />
    <meta
      property="og:description"
      content="Discover Divyanshu Singh's professional portfolio, frontend development projects, technical skills, and experience."
    />
    <meta
      property="og:url"
      content="https://developer-portfolio-six-rouge.vercel.app/"
    />
    <meta
      property="og:site_name"
      content="Divyanshu Singh Portfolio"
    />
    <meta property="og:locale" content="en_IN" />
    <meta
      property="og:image"
      content="https://developer-portfolio-six-rouge.vercel.app/favicon.png"
    />
    <meta
      property="og:image:alt"
      content="Divyanshu Singh Portfolio"
    />

    <!-- Twitter / X SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Divyanshu Singh | Frontend Developer"
    />
    <meta
      name="twitter:description"
      content="Explore my portfolio, web development projects, technical skills, and professional experience."
    />
    <meta
      name="twitter:image"
      content="https://developer-portfolio-six-rouge.vercel.app/favicon.png"
    />

    <!-- Person Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://developer-portfolio-six-rouge.vercel.app/#person",
      "name": "Divyanshu Singh",
      "url": "https://developer-portfolio-six-rouge.vercel.app/",
      "jobTitle": "Frontend Developer",
      "description": "BCA student interested in frontend development, web technologies, and creating modern user-friendly web applications.",
      "sameAs": [
        "https://github.com/divyanshusingh-dev",
        "https://linkedin.com/in/divyanshusingh077"
      ],
      "knowsAbout": [
        "Frontend Development",
        "HTML",
        "CSS",
        "JavaScript",
        "React",
        "TypeScript",
        "Web Development",
        "Responsive Web Design"
      ]
    }
    </script>

    <!-- Website Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://developer-portfolio-six-rouge.vercel.app/#website",
      "name": "Divyanshu Singh Portfolio",
      "url": "https://developer-portfolio-six-rouge.vercel.app/",
      "description": "Official portfolio of Divyanshu Singh featuring projects, skills, education, and professional experience.",

        "@id": "https://developer-portfolio-six-rouge.vercel.app/#person"
      }

  </head>

  <body>
